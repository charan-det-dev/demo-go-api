version: '3.8'
services:
  demo-api-go:
    image: demo-go-api # เปลี่ยนชื่อ image เป็น my-go-api
    build: . # ใช้ Dockerfile ใน directory ปัจจุบัน
    container_name: demo-go-api
    # image: demo-go-api # ชื่อ image ที่จะใช้
    ports:
      - "3000:3000" # Map port 3000 บน host ไปยัง port 3000 ใน container
    # ถ้ามี volume ที่ต้องการ mount
    # volumes:
    #   - ./your-go-code:/app